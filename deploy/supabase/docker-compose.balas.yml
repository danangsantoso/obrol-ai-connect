# Balas.id additions to the official self-hosted Supabase stack.
# setup-vps.sh copies this next to docker-compose.yml and adds it to COMPOSE_FILE in .env.
services:
  # Docker publishes ports past the ufw firewall, so everything listens on
  # localhost only; Caddy is the single public entry point (80/443).
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"

  # Balas.id does not use the connection pooler (functions go through the API,
  # migrations through the db container), so it only starts on request:
  # docker compose --profile pooler up -d
  supavisor:
    profiles: ["pooler"]
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

  auth:
    environment:
      # Sign-in code email (the file ships with the web app build).
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${APP_URL}/email/magic-link.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Kode masuk Balas.id"
      # "Masuk dengan Google" (Google Cloud Console -> OAuth client ID, type Web application;
      # authorized redirect URI: <API URL>/auth/v1/callback). Off until GOOGLE_ENABLED=true.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

  functions:
    environment:
      # WhatsApp Cloud API (Meta Business Manager -> WhatsApp -> API Setup / App settings)
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-v23.0}
      WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-https://graph.facebook.com}
      # Evolution API gateway for numbers linked by QR code (service below)
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_URL: http://functions:9000/wa-qr-webhook
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN}
      # Facebook Messenger / Instagram: Meta app (can be the WhatsApp app) and the
      # public API address used for the "Login with Facebook" redirect and media links
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      PUBLIC_API_URL: ${SUPABASE_PUBLIC_URL}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-https://api.telegram.org}
      # Encryption key for AI provider API keys and Page tokens stored in the database
      BALAS_SECRET_KEY: ${BALAS_SECRET_KEY}
      # Public URL of the web app: CORS origin and invitation redirect
      APP_ORIGIN: ${APP_URL}
      APP_URL: ${APP_URL}

  # Evolution API: links regular WhatsApp numbers by QR code (WhatsApp Web
  # protocol) for QR channels. Internal only: Edge Functions call it at
  # http://evolution:8080 and it posts events to the wa-qr-webhook function.
  # Data (sessions) lives in its own "evolution" database on the Supabase
  # Postgres server; Prisma creates it on first start.
  evolution:
    container_name: balas-evolution
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: balas
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # Needed for media download and message retries; Balas.id keeps the chat history itself.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: 30
      QRCODE_COLOR: "#1d4ed8"
      CONFIG_SESSION_PHONE_CLIENT: Balas.id
      CONFIG_SESSION_PHONE_NAME: Chrome
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBHOOK_REQUEST_TIMEOUT_MS: 60000
      TELEMETRY_ENABLED: "false"
      LANGUAGE: en
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      LOG_COLOR: "false"
    volumes:
      - ./volumes/evolution:/evolution/instances
